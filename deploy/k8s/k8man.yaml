apiVersion: v1
kind: Namespace
metadata:
  name: k8man
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8man-data
  namespace: k8man
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8man
  namespace: k8man
  labels:
    app: k8man
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8man
  template:
    metadata:
      labels:
        app: k8man
    spec:
      # 若节点未配置腾讯云 CCR 拉取凭证，取消注释并创建同名 Secret：
      # imagePullSecrets:
      #   - name: tcr-igokorea
      containers:
        - name: k8man
          image: krccr.ccs.tencentyun.com/igokorea/k8man:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: K8MAN_ADDR
              value: ":8080"
            - name: K8MAN_DATA_DIR
              value: /data
            - name: K8MAN_DB_PATH
              value: /data/k8man.db
            - name: K8MAN_ETC_DIR
              value: /etc/k8man
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /data
            # 可选：挂载自定义 etc（含 k8man.conf / banner.jpg）；不挂则用镜像内默认 conf
            # - name: etc
            #   mountPath: /etc/k8man
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8man-data
---
apiVersion: v1
kind: Service
metadata:
  name: k8man
  namespace: k8man
spec:
  selector:
    app: k8man
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8man
  namespace: k8man
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: k8man.sunwoda-evb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8man
                port:
                  name: http
